server {

    listen 80;

    server_name localhost;



    root /var/www/html/public;

    index index.html;



    # Evitar la cache del navegador para archivos HTML durante el desarrollo

    location ~* \.html$ {

        add_header Cache-Control "no-store" always;

        try_files $uri =404;

    }



    # Servir archivos estáticos

    location / {

        try_files $uri $uri/ =404;

    }



    # Permite subcarpetas dentro de cgi-bin

    location ~ ^/cgi-bin/(?<cgi_script>[a-zA-Z0-9_/-]+\.py)$ {

        include fastcgi_params;



        # Ruta del programa dentro del contenedor CGI

        fastcgi_param SCRIPT_FILENAME /app/cgi-bin/$cgi_script;



        # Comunicación con fcgiwrap

        fastcgi_pass cgi:9000;

    }



    # Impedir que se sirvan archivos PHP como texto

    location ~ \.php$ {

        return 404;

    }

}