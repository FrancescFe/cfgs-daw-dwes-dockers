<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comprobar paridad</title>
</head>
<body>
    <h1>¿Es par o impar?</h1>

    <form method="post">
        {% csrf_token %}

        <label for="numero">Introduce un número entero:</label>

        <input
            type="number"
            id="numero"
            name="numero"
            required
        >

        <button type="submit">Comprobar</button>
    </form>

    {% if resultado %}
        <h2>{{ resultado }}</h2>
    {% endif %}

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
</body>
</html>
